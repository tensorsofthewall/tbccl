name: Documentation feedback or question
description: An error, a gap or an unclear sentence, or a question the documentation should have answered
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: "Page or file"
      description: "A link to the page, or the path of the file."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What is wrong, missing or unclear, or what you were trying to do"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What you expected to find"
    validations:
      required: false
