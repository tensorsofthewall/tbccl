name: clean install

# Installs each adapter into a brand-new environment with scripts/install_adapter.py from the wheels on the current stable GitHub Releases, then runs it:
# the helper's own verification, a two-rank loopback all_reduce (torch-tbccl) or the version and plugin check (vllm-tbccl). It builds nothing, downloads no
# model, creates no tag or release and publishes nothing. Linux needs the CUDA build of PyTorch to import torch-tbccl (a GPU is not needed), which is a
# large download, so this runs weekly, by hand and when the install tooling changes, not on every push. Not covered here: vllm-tbccl on Linux (vLLM's CUDA
# install is larger than a hosted runner's disk), and the Metal pairing (the fork wheel is not attached to a release yet).
on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 2"
  pull_request:
    paths:
      - scripts/install_adapter.py
      - release/wheels.json
      - release/ecosystem.json
      - tools/clean_install_*.py
      - .github/workflows/clean-install.yml

permissions:
  contents: read

concurrency:
  group: clean-install-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.9.18"

jobs:
  torch:
    name: torch-tbccl on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Linux x86-64", os: ubuntu-24.04, torch_args: "--torch-backend cu130"}
          - {name: "macOS arm64", os: macos-15, torch_args: ""}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Helper tests
        run: python tests/install_adapter_test.py
      - name: Empty environment, then PyTorch (the user's step)
        run: |
          python scripts/install_adapter.py create-env "$RUNNER_TEMP/env" --python-version 3.13
          uv pip install --python "$RUNNER_TEMP/env/bin/python" "torch==2.13.0" numpy ${{ matrix.torch_args }}
      - name: Install the adapter with the helper
        run: python scripts/install_adapter.py install --adapter torch --python "$RUNNER_TEMP/env/bin/python" --device cpu
      - name: Installing again changes nothing
        run: |
          python scripts/install_adapter.py install --adapter torch --python "$RUNNER_TEMP/env/bin/python" --device cpu 2>&1 | tee again.txt
          grep -qi "already installed" again.txt
      - name: Two-rank loopback all_reduce
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/env/bin/python" tools/clean_install_smoke.py
      - name: Summary
        if: always()
        run: |
          echo "torch-tbccl on ${{ matrix.name }}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  vllm:
    name: vllm-tbccl on macOS arm64 (CPU wheel pairing)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Empty Python 3.12 environment, then vLLM (the user's step)
        run: |
          python scripts/install_adapter.py create-env "$RUNNER_TEMP/env" --python-version 3.12
          uv pip install --python "$RUNNER_TEMP/env/bin/python" "https://github.com/vllm-project/vllm/releases/download/v0.31.0/vllm-0.31.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl"
      - name: Install the adapter with the helper
        run: python scripts/install_adapter.py install --adapter vllm --python "$RUNNER_TEMP/env/bin/python" --device cpu
      - name: Versions, native module and plugin discovery
        run: |
          "$RUNNER_TEMP/env/bin/python" tools/clean_install_vllm_check.py
      - name: Summary
        if: always()
        run: |
          echo "vllm-tbccl on macOS arm64: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
