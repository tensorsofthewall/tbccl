name: docs
on:
  pull_request:
  push:
    branches: [main]
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      - name: Build documentation (warnings are errors)
        run: make docs
      - name: Check local links
        run: make docs-linkcheck
      - name: Check the compatibility manifest
        run: python3 scripts/check_compatibility_manifest.py
      - name: Check the release state (offline)
        run: python3 tools/check_release_state.py
      - name: Check the repository-internal links (offline)
        run: python3 tools/check_links.py
      - name: Test the maintenance tooling
        run: python3 tests/maintenance_tools_test.py
      - name: Test the installation documentation
        run: python3 tests/install_docs_test.py
      - name: Check the ecosystem manifest (offline)
        run: python3 tools/check_ecosystem_manifest.py
