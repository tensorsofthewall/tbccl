version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - doxygen
  jobs:
    # pip 26.2.2 from its hash-pinned wheel before the requirements are installed: the pip that ships with the build image trusts the emSign root revoked in
    # October 2026, and pip cannot be repaired from outside. The image's own steps before this one are Read the Docs' and are not under our control.
    post_create_environment:
      - python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
