# B3B preset: collective algorithm comparison over the link (legacy synchronous World API, host memory, float32 SUM, 2 ranks)
# Physical (Thunderbolt) campaign. The real addresses, paths and launcher live in a git-ignored overlay (see docs/development/benchmark-suite.md); this file holds the
# workload matrix and the safety limits. Start with a preliminary overlay (few iterations, one repetition), run `doctor --probe --allow-physical` and `--dry-run`
# first, and only then run with --allow-physical.  Results are local and git-ignored.  Performance numbers are never CI gates.
# The numbers describe tbccl_collective_bench, which uses the legacy synchronous World API: not nonblocking Communicator performance.
# Large payloads use fewer iterations to bound the volume; the iteration counts are recorded with every result.
schema: tbccl-bench-config/1
name: b3b-collectives
description: "collective algorithm comparison over the link (legacy synchronous World API, host memory, float32 SUM, 2 ranks)"
defaults:
  warmup: 20
  iterations: 50
  repetitions: 3
  timeout_s: 300
  startup_wait_s: 20
  lease_s: 30
  term_grace_s: 3
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: true, require_stamped: true}
  health: {strict: true, snapshot_each_point: true, max_load_fraction: 0.75}
limits:
  max_processes: 2
  max_point_bytes: 2147483648    # 2 GiB per repetition
  max_total_bytes: 64424509440   # 60 GiB
  max_campaign_s: 7200
topology:
  kind: direct-link
  interconnect: thunderbolt4-ip      # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine the suite runs on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables_dir: <HOST_A_BUILD_DIR>
    executables: {iperf3: <HOST_A_IPERF3>}
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables_dir: <HOST_B_BUILD_DIR>
    executables: {iperf3: <HOST_B_IPERF3>}
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  - {name: small-and-medium, benchmark: collective_bench, operations: [all_reduce, all_gather, reduce_scatter], algorithms: [reference, ring, auto], datatype: float32,
     sizes: [64, 256, 1024, 4096, 16384, 65536, 262144, 1048576], orientations: [forward, reverse]}
  - {name: large-4MiB, benchmark: collective_bench, operations: [all_reduce, all_gather, reduce_scatter], algorithms: [reference, ring, auto], datatype: float32,
     sizes: [4194304], warmup: 5, iterations: 20, orientations: [forward]}
  - {name: large-16MiB, benchmark: collective_bench, operations: [all_reduce, all_gather, reduce_scatter], algorithms: [reference, ring, auto], datatype: float32,
     sizes: [16777216], warmup: 3, iterations: 10, orientations: [forward]}
  # experimental, a separate series with an explicit chunk size (a limited comparison, not a tuning sweep)
  - {name: pipelined-64KiB-chunks, benchmark: collective_bench, operations: [all_reduce, all_gather], algorithms: [ring-pipelined], datatype: float32, sizes: [1048576, 4194304],
     warmup: 5, iterations: 20, options: {chunk_bytes: 65536}, orientations: [forward]}
  - {name: pipelined-256KiB-chunks, benchmark: collective_bench, operations: [all_reduce, all_gather], algorithms: [ring-pipelined], datatype: float32, sizes: [1048576, 4194304],
     warmup: 5, iterations: 20, options: {chunk_bytes: 262144}, orientations: [forward]}
