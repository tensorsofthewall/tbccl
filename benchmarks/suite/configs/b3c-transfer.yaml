# B3C preset: heterogeneous device-memory end-to-end transfer over the link, with a host-memory control and the host-only ack-calibration mode
# Physical (Thunderbolt) campaign between a CUDA host (host-a) and a Metal host (host-b). Real addresses, paths and launcher live in a git-ignored overlay; this file holds the
# workload matrix and the safety limits. Run `doctor --probe --allow-physical` and `--dry-run` first, then run tier by tier with --allow-physical. Results are local and git-ignored.
schema: tbccl-bench-config/1
name: b3c-transfer
description: "heterogeneous device-memory end-to-end transfer over the link, with a host-memory control and the host-only ack-calibration mode"
defaults:
  warmup: 5
  iterations: 30
  repetitions: 3
  timeout_s: 300
  startup_wait_s: 20
  lease_s: 30
  term_grace_s: 3
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: true, require_stamped: true}
  health: {strict: true, snapshot_each_point: true, max_load_fraction: 0.75}
limits:
  max_processes: 2
  max_point_bytes: 4294967296     # 4 GiB per repetition
  max_total_bytes: 107374182400
  max_campaign_s: 3600
topology:
  kind: direct-link
  interconnect: thunderbolt4-ip      # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine the suite runs on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables_dir: <HOST_A_BUILD_DIR>
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables_dir: <HOST_B_BUILD_DIR>
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  - {name: host-control, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: host, source_ranks: [0, 1], orientations: [forward, reverse]}
  - {name: ack-floor, benchmark: tensor_transfer, operation: ack_calibration, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: host, source_ranks: [0, 1], orientations: [forward]}
  - {name: pinned-shared, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: {host-a: cuda-pinned, host-b: metal-shared}, source_ranks: [0, 1], orientations: [forward, reverse]}
  - {name: pageable-shared, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: {host-a: cuda-pageable, host-b: metal-shared}, source_ranks: [0, 1], orientations: [forward, reverse]}
  - {name: pinned-private, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: {host-a: cuda-pinned, host-b: metal-private-staged}, source_ranks: [0, 1], orientations: [forward, reverse]}
  - {name: pageable-private, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 1048576, 16777216], memory_backend: {host-a: cuda-pageable, host-b: metal-private-staged}, source_ranks: [0, 1], orientations: [forward]}
  - {name: pinned-host, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: {host-a: cuda-pinned, host-b: host}, source_ranks: [0, 1], orientations: [forward, reverse]}
  - {name: host-shared, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 65536, 262144, 1048576, 4194304, 16777216], memory_backend: {host-a: host, host-b: metal-shared}, source_ranks: [0, 1], orientations: [forward, reverse]}
  - {name: host-private, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 1048576, 16777216], memory_backend: {host-a: host, host-b: metal-private-staged}, source_ranks: [0, 1], orientations: [forward]}
  # timing scope 'produce' includes the producer; kept separate from 'ready' (the default above)
  - {name: pinned-shared-produce, benchmark: tensor_transfer, operation: end_to_end, sizes: [4096, 1048576, 16777216], memory_backend: {host-a: cuda-pinned, host-b: metal-shared}, source_ranks: [0, 1], orientations: [forward], options: {timing_scope: produce}}
