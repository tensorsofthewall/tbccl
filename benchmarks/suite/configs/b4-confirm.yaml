# B4 preset: five-repetition confirmation of selected collective, point-to-point, asynchronous and DDP points
# Physical (Thunderbolt) campaign: PyTorch over torch-tbccl (and Gloo as a CPU baseline) between a Linux host (host-a: CPU, CUDA) and a macOS host (host-b: CPU, MPS).
# Real addresses, paths, the torch interpreter and the launcher live in a git-ignored overlay; this file holds the workload matrix and the safety limits. Run `doctor --probe --allow-physical`
# and `--dry-run` first, then run tier by tier with --allow-physical. Results are local and git-ignored; performance numbers are never CI gates. Generated by generate_b4.py.
schema: tbccl-bench-config/1
name: b4-confirm
description: "five-repetition confirmation of selected collective, point-to-point, asynchronous and DDP points"
defaults:
  warmup: 5
  iterations: 100
  repetitions: 5
  timeout_s: 1800
  startup_wait_s: 90
  lease_s: 30
  term_grace_s: 3
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: true, require_stamped: true}
  health: {strict: true, snapshot_each_point: true, max_load_fraction: 0.9}
limits:
  max_processes: 2
  max_point_bytes: 8589934592     # 8 GiB per repetition
  max_total_bytes: 214748364800
  max_campaign_s: 10800
topology:
  kind: direct-link
  interconnect: thunderbolt4-ip      # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine the suite runs on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables_dir: <HOST_A_BUILD_DIR>
    executables: {torch_python: <HOST_A_TORCH_PYTHON>}
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables_dir: <HOST_B_BUILD_DIR>
    executables: {torch_python: <HOST_B_TORCH_PYTHON>, torch_bench_dir: <HOST_B_TORCH_BENCH_DIR>}
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  - {name: k-cpu-cpu-ar-4096, benchmark: torch_collectives, operation: all_reduce, sizes: [4096], memory_backend: {host-a: host, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cpu-cpu-p2p-4096, benchmark: torch_p2p, operation: p2p_ack, sizes: [4096], memory_backend: {host-a: host, host-b: host}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cpu-cpu-async-4096, benchmark: torch_async, operation: all_reduce_async, sizes: [4096], memory_backend: {host-a: host, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cpu-cpu-ar-1048576, benchmark: torch_collectives, operation: all_reduce, sizes: [1048576], memory_backend: {host-a: host, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cpu-cpu-p2p-1048576, benchmark: torch_p2p, operation: p2p_ack, sizes: [1048576], memory_backend: {host-a: host, host-b: host}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cpu-cpu-async-1048576, benchmark: torch_async, operation: all_reduce_async, sizes: [1048576], memory_backend: {host-a: host, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cpu-cpu-ar-16777216, benchmark: torch_collectives, operation: all_reduce, sizes: [16777216], memory_backend: {host-a: host, host-b: host}, orientations: [forward], iterations: 30}
  - {name: k-cpu-cpu-p2p-16777216, benchmark: torch_p2p, operation: p2p_ack, sizes: [16777216], memory_backend: {host-a: host, host-b: host}, source_ranks: [0, 1], orientations: [forward], iterations: 30}
  - {name: k-cpu-cpu-async-16777216, benchmark: torch_async, operation: all_reduce_async, sizes: [16777216], memory_backend: {host-a: host, host-b: host}, orientations: [forward], iterations: 30}
  - {name: k-cpu-cpu-ddp-M-b64, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: host, host-b: host}, orientations: [forward], options: {layers: 8, width: 1024, batch: 64, bucket_cap_mb: 25, tag: M-b64-bk25, steps: 20}}
  - {name: k-cuda-cpu-ar-4096, benchmark: torch_collectives, operation: all_reduce, sizes: [4096], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cuda-cpu-p2p-4096, benchmark: torch_p2p, operation: p2p_ack, sizes: [4096], memory_backend: {host-a: cuda, host-b: host}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cuda-cpu-async-4096, benchmark: torch_async, operation: all_reduce_async, sizes: [4096], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cuda-cpu-ar-1048576, benchmark: torch_collectives, operation: all_reduce, sizes: [1048576], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cuda-cpu-p2p-1048576, benchmark: torch_p2p, operation: p2p_ack, sizes: [1048576], memory_backend: {host-a: cuda, host-b: host}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cuda-cpu-async-1048576, benchmark: torch_async, operation: all_reduce_async, sizes: [1048576], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], iterations: 100}
  - {name: k-cpu-mps-ar-4096, benchmark: torch_collectives, operation: all_reduce, sizes: [4096], memory_backend: {host-a: host, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cpu-mps-p2p-4096, benchmark: torch_p2p, operation: p2p_ack, sizes: [4096], memory_backend: {host-a: host, host-b: mps}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cpu-mps-async-4096, benchmark: torch_async, operation: all_reduce_async, sizes: [4096], memory_backend: {host-a: host, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cpu-mps-ar-1048576, benchmark: torch_collectives, operation: all_reduce, sizes: [1048576], memory_backend: {host-a: host, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cpu-mps-p2p-1048576, benchmark: torch_p2p, operation: p2p_ack, sizes: [1048576], memory_backend: {host-a: host, host-b: mps}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cpu-mps-async-1048576, benchmark: torch_async, operation: all_reduce_async, sizes: [1048576], memory_backend: {host-a: host, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-ar-4096, benchmark: torch_collectives, operation: all_reduce, sizes: [4096], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-p2p-4096, benchmark: torch_p2p, operation: p2p_ack, sizes: [4096], memory_backend: {host-a: cuda, host-b: mps}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-async-4096, benchmark: torch_async, operation: all_reduce_async, sizes: [4096], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-ar-1048576, benchmark: torch_collectives, operation: all_reduce, sizes: [1048576], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-p2p-1048576, benchmark: torch_p2p, operation: p2p_ack, sizes: [1048576], memory_backend: {host-a: cuda, host-b: mps}, source_ranks: [0, 1], orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-async-1048576, benchmark: torch_async, operation: all_reduce_async, sizes: [1048576], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], iterations: 100}
  - {name: k-cuda-mps-ar-16777216, benchmark: torch_collectives, operation: all_reduce, sizes: [16777216], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], iterations: 30}
  - {name: k-cuda-mps-p2p-16777216, benchmark: torch_p2p, operation: p2p_ack, sizes: [16777216], memory_backend: {host-a: cuda, host-b: mps}, source_ranks: [0, 1], orientations: [forward], iterations: 30}
  - {name: k-cuda-mps-async-16777216, benchmark: torch_async, operation: all_reduce_async, sizes: [16777216], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], iterations: 30}
  - {name: k-cuda-mps-ddp-M-b64, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], options: {layers: 8, width: 1024, batch: 64, bucket_cap_mb: 25, tag: M-b64-bk25, steps: 20}}
  - {name: k-cuda-mps-ddp-M-b2048, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], options: {layers: 8, width: 1024, batch: 2048, bucket_cap_mb: 25, tag: M-b2048-bk25, steps: 10}}
