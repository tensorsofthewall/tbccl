# B4 preset: two-rank DDP with larger batches: balanced and compute-bound configurations, and the accelerator/CPU compute imbalance
# Physical (Thunderbolt) campaign: PyTorch over torch-tbccl (and Gloo as a CPU baseline) between a Linux host (host-a: CPU, CUDA) and a macOS host (host-b: CPU, MPS).
# Real addresses, paths, the torch interpreter and the launcher live in a git-ignored overlay; this file holds the workload matrix and the safety limits. Run `doctor --probe --allow-physical`
# and `--dry-run` first, then run tier by tier with --allow-physical. Results are local and git-ignored; performance numbers are never CI gates. Generated by generate_b4.py.
schema: tbccl-bench-config/1
name: b4-ddp-compute
description: "two-rank DDP with larger batches: balanced and compute-bound configurations, and the accelerator/CPU compute imbalance"
defaults:
  warmup: 2
  iterations: 100
  repetitions: 3
  timeout_s: 1800
  startup_wait_s: 90
  lease_s: 30
  term_grace_s: 3
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: true, require_stamped: true}
  health: {strict: true, snapshot_each_point: true, max_load_fraction: 0.9}
limits:
  max_processes: 2
  max_point_bytes: 8589934592     # 8 GiB per repetition
  max_total_bytes: 214748364800
  max_campaign_s: 10800
topology:
  kind: direct-link
  interconnect: thunderbolt4-ip      # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine the suite runs on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables_dir: <HOST_A_BUILD_DIR>
    executables: {torch_python: <HOST_A_TORCH_PYTHON>}
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables_dir: <HOST_B_BUILD_DIR>
    executables: {torch_python: <HOST_B_TORCH_PYTHON>, torch_bench_dir: <HOST_B_TORCH_BENCH_DIR>}
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  # cpu-cpu S-b512: small model, 8x batch: balances compute and the 4.2 MB gradient exchange on the accelerators
  - {name: dc-cpu-cpu-S-b512, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: host, host-b: host}, orientations: [forward], options: {layers: 4, width: 512, batch: 512, bucket_cap_mb: 25, tag: S-b512-bk25, steps: 20}}
  # cuda-cpu S-b512: small model, 8x batch: balances compute and the 4.2 MB gradient exchange on the accelerators
  - {name: dc-cuda-cpu-S-b512, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], options: {layers: 4, width: 512, batch: 512, bucket_cap_mb: 25, tag: S-b512-bk25, steps: 20}}
  # cuda-mps S-b512: small model, 8x batch: balances compute and the 4.2 MB gradient exchange on the accelerators
  - {name: dc-cuda-mps-S-b512, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], options: {layers: 4, width: 512, batch: 512, bucket_cap_mb: 25, tag: S-b512-bk25, steps: 20}}
  # cpu-cpu S-b2048: small model, 32x batch: compute-bound on the CPU ranks, still cheap on the accelerators
  - {name: dc-cpu-cpu-S-b2048, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: host, host-b: host}, orientations: [forward], options: {layers: 4, width: 512, batch: 2048, bucket_cap_mb: 25, tag: S-b2048-bk25, steps: 20}}
  # cuda-cpu S-b2048: small model, 32x batch: compute-bound on the CPU ranks, still cheap on the accelerators
  - {name: dc-cuda-cpu-S-b2048, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], options: {layers: 4, width: 512, batch: 2048, bucket_cap_mb: 25, tag: S-b2048-bk25, steps: 20}}
  # cpu-mps S-b2048: small model, 32x batch: compute-bound on the CPU ranks, still cheap on the accelerators
  - {name: dc-cpu-mps-S-b2048, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: host, host-b: mps}, orientations: [forward], options: {layers: 4, width: 512, batch: 2048, bucket_cap_mb: 25, tag: S-b2048-bk25, steps: 20}}
  # cuda-mps S-b2048: small model, 32x batch: compute-bound on the CPU ranks, still cheap on the accelerators
  - {name: dc-cuda-mps-S-b2048, benchmark: torch_ddp, operation: train, sizes: [4202496], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], options: {layers: 4, width: 512, batch: 2048, bucket_cap_mb: 25, tag: S-b2048-bk25, steps: 20}}
  # cpu-cpu M-b2048: medium model, large batch (103 GFLOP of forward/backward per step): compute-bound everywhere, the accelerator/CPU imbalance dominates
  - {name: dc-cpu-cpu-M-b2048, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: host, host-b: host}, orientations: [forward], options: {layers: 8, width: 1024, batch: 2048, bucket_cap_mb: 25, tag: M-b2048-bk25, steps: 10}}
  # cuda-cpu M-b2048: medium model, large batch (103 GFLOP of forward/backward per step): compute-bound everywhere, the accelerator/CPU imbalance dominates
  - {name: dc-cuda-cpu-M-b2048, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: cuda, host-b: host}, orientations: [forward], options: {layers: 8, width: 1024, batch: 2048, bucket_cap_mb: 25, tag: M-b2048-bk25, steps: 10}}
  # cpu-mps M-b2048: medium model, large batch (103 GFLOP of forward/backward per step): compute-bound everywhere, the accelerator/CPU imbalance dominates
  - {name: dc-cpu-mps-M-b2048, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: host, host-b: mps}, orientations: [forward], options: {layers: 8, width: 1024, batch: 2048, bucket_cap_mb: 25, tag: M-b2048-bk25, steps: 10}}
  # cuda-mps M-b2048: medium model, large batch (103 GFLOP of forward/backward per step): compute-bound everywhere, the accelerator/CPU imbalance dominates
  - {name: dc-cuda-mps-M-b2048, benchmark: torch_ddp, operation: train, sizes: [33587200], memory_backend: {host-a: cuda, host-b: mps}, orientations: [forward], options: {layers: 8, width: 1024, batch: 2048, bucket_cap_mb: 25, tag: M-b2048-bk25, steps: 10}}
