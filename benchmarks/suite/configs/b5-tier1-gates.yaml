# B5 preset: pipeline startup, transport proof and correctness gates for the three validated stage assignments
# Physical (Thunderbolt) campaign: vLLM 0.31.0 pipeline parallelism (PP=2, TP=1) over vllm-tbccl 0.2.0 between a Linux host (host-a: CUDA) and a macOS host (host-b: Metal or CPU).
# Real addresses, paths, interpreters and the launcher live in a git-ignored overlay; this file holds the workload matrix and the safety limits. Run `doctor --probe --allow-physical`
# and `--dry-run` first, then run tier by tier with --allow-physical. Results are local and git-ignored; performance numbers are never CI gates. Generated by generate_b5.py.
schema: tbccl-bench-config/1
name: b5-tier1-gates
description: "pipeline startup, transport proof and correctness gates for the three validated stage assignments"
defaults:
  repetitions: 1
  timeout_s: 2700
  startup_wait_s: 90
  lease_s: 30
  term_grace_s: 20
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: false, require_stamped: false}
  health: {strict: true, snapshot_each_point: true, max_load_fraction: 4.0}
limits:
  max_processes: 8
  max_point_bytes: 8589934592
  max_total_bytes: 34359738368
  max_campaign_s: 14400
topology:
  kind: direct-link
  interconnect: thunderbolt4-ip      # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine the suite runs on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables: {vllm: <HOST_A_VLLM>, vllm_python: <HOST_A_VLLM_PYTHON>, vllm_model_dir: <HOST_A_MODEL_DIR>, vllm_workload: <HOST_A_WORKLOAD>, vllm_reference: <HOST_A_REFERENCE>}
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables: {vllm: <HOST_B_VLLM>, vllm_python: <HOST_B_VLLM_PYTHON>, vllm_model_dir: <HOST_B_MODEL_DIR>, vllm_bench_dir: <HOST_B_VLLM_BENCH_DIR>, vllm_workload: <HOST_B_WORKLOAD>, vllm_reference: <HOST_B_REFERENCE>}
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  - {"name": "gates-cuda-metal", "benchmark": "vllm_correctness", "operation": "gates", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "metal"}, "orientations": ["forward"], "options": {"dtype": "bfloat16", "max_model_len": 4096, "gpu_memory_utilization": {"host-a": 0.5, "host-b": 0.3}, "startup_timeout_s": 600, "request_timeout_s": 180, "tag": "gates-cuda-metal", "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "tokens": 8, "requests": 3}, {"name": "gate-seq", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 32, "scrape": false}, {"name": "gate-seq-long", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 64, "scrape": false}, {"name": "gate-conc12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "seed": 11}, {"name": "gate-conc12-b", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "seed": 12}, {"name": "gate-mixed12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 64, "random_len": true, "seed": 13}, {"name": "gate-stagger12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "stagger_s": 0.5, "seed": 14}, {"name": "gate-repeat", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "repeat": 3, "tokens": 16}, {"name": "gate-cancel", "kind": "cancel", "prompt": "p128", "tokens": 400, "streams": 8, "complete_every": 4, "drop_after_events": 4, "followup": {"kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 32}}]}, "timeout_s": 2700}
  - {"name": "gates-metal-cuda", "benchmark": "vllm_correctness", "operation": "gates", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "metal"}, "orientations": ["reverse"], "options": {"dtype": "bfloat16", "max_model_len": 4096, "gpu_memory_utilization": {"host-a": 0.5, "host-b": 0.3}, "startup_timeout_s": 600, "request_timeout_s": 180, "tag": "gates-metal-cuda", "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "tokens": 8, "requests": 3}, {"name": "gate-seq", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 32, "scrape": false}, {"name": "gate-seq-long", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 64, "scrape": false}, {"name": "gate-conc12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "seed": 11}, {"name": "gate-conc12-b", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "seed": 12}, {"name": "gate-mixed12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 64, "random_len": true, "seed": 13}, {"name": "gate-stagger12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "stagger_s": 0.5, "seed": 14}, {"name": "gate-repeat", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "repeat": 3, "tokens": 16}, {"name": "gate-cancel", "kind": "cancel", "prompt": "p128", "tokens": 400, "streams": 8, "complete_every": 4, "drop_after_events": 4, "followup": {"kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 32}}]}, "timeout_s": 2700}
  - {"name": "gates-cuda-cpu", "benchmark": "vllm_correctness", "operation": "gates", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "host"}, "orientations": ["forward"], "options": {"dtype": "bfloat16", "max_model_len": 4096, "gpu_memory_utilization": {"host-a": 0.5, "host-b": 0.3}, "startup_timeout_s": 600, "request_timeout_s": 180, "tag": "gates-cuda-cpu", "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "tokens": 8, "requests": 3}, {"name": "gate-seq", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 32, "scrape": false}, {"name": "gate-seq-long", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 64, "scrape": false}, {"name": "gate-conc12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "seed": 11}, {"name": "gate-conc12-b", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "seed": 12}, {"name": "gate-mixed12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 64, "random_len": true, "seed": 13}, {"name": "gate-stagger12", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 12, "repeat": 3, "tokens": 32, "stagger_s": 0.5, "seed": 14}, {"name": "gate-repeat", "kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "repeat": 3, "tokens": 16}, {"name": "gate-cancel", "kind": "cancel", "prompt": "p128", "tokens": 400, "streams": 8, "complete_every": 4, "drop_after_events": 4, "followup": {"kind": "check", "cases": ["p16", "p128", "p512", "p1000", "p2000"], "conc": 1, "tokens": 32}}]}, "timeout_s": 2700}
