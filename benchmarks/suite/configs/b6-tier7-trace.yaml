# B6 preset: traced MlxTbccl and MlxRing lifecycles (exo-tbccl trace and CopyStats through the diagnostic hook), p128/o32; instrumented, reported separately
# Physical (Thunderbolt) campaign: Exo pipeline parallelism (two nodes) between a Linux host (host-a: CUDA) and a macOS host (host-b: Metal), MlxTbccl through exo-tbccl 0.3.0 against MlxRing.
# Real addresses, paths, interpreters and the launcher live in a git-ignored overlay; this file holds the workload matrix and the safety limits. Run `doctor --probe --allow-physical`
# and `--dry-run` first, then run tier by tier with --allow-physical. Results are local and git-ignored; performance numbers are never CI gates. Generated by generate_b6.py.
schema: tbccl-bench-config/1
name: b6-tier7-trace
description: "traced MlxTbccl and MlxRing lifecycles (exo-tbccl trace and CopyStats through the diagnostic hook), p128/o32; instrumented, reported separately"
defaults:
  repetitions: 1
  timeout_s: 1800
  startup_wait_s: 30
  lease_s: 30
  term_grace_s: 30
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: false, require_stamped: false}
  health: {strict: true, snapshot_each_point: true, max_load_fraction: 8.0}
limits:
  max_processes: 8
  max_point_bytes: 8589934592
  max_total_bytes: 8589934592
  max_campaign_s: 14400
topology:
  kind: direct-link
  interconnect: thunderbolt4-ip      # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine the suite runs on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables: {exo: <HOST_A_EXO>, exo_python: <HOST_A_EXO_PYTHON>, exo_bench_dir: <HOST_A_EXO_BENCH_DIR>, exo_home: <HOST_A_EXO_HOME>, exo_dashboard_dir: <HOST_A_EXO_DASHBOARD_DIR>, exo_lan_address: <HOST_A_LAN_ADDRESS>}
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables: {exo: <HOST_B_EXO>, exo_python: <HOST_B_EXO_PYTHON>, exo_bench_dir: <HOST_B_EXO_BENCH_DIR>, exo_home: <HOST_B_EXO_HOME>, exo_dashboard_dir: <HOST_B_EXO_DASHBOARD_DIR>, exo_lan_address: <HOST_B_LAN_ADDRESS>}
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  - {"name": "trace-1-mlxring", "benchmark": "exo_stage_profile", "operation": "trace", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "metal"}, "orientations": ["forward"], "options": {"model_id": "mlx-community/Qwen3-0.6B-8bit", "backend": "MlxRing", "prompts": {"short": {"text": "Count from one to five in words.", "approx_tokens": 20}, "p16": {"items": 0, "approx_tokens": 24}, "p128": {"items": 6, "approx_tokens": 140}, "p512": {"items": 24, "approx_tokens": 520}}, "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "max_tokens": 8, "requests": 3}, {"name": "lat-r1-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}, {"name": "lat-r2-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}], "memory_override_mb": {"host-a": 5200, "host-b": 10800}, "load_timeout_s": 900, "request_timeout_s": 300, "tag": "trace-1-mlxring", "primary": {"phase": "lat-r1-p128-o32", "metric": "tpot"}, "trace": true}, "timeout_s": 1800}
  - {"name": "trace-2-mlxtbccl", "benchmark": "exo_stage_profile", "operation": "trace", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "metal"}, "orientations": ["forward"], "options": {"model_id": "mlx-community/Qwen3-0.6B-8bit", "backend": "MlxTbccl", "prompts": {"short": {"text": "Count from one to five in words.", "approx_tokens": 20}, "p16": {"items": 0, "approx_tokens": 24}, "p128": {"items": 6, "approx_tokens": 140}, "p512": {"items": 24, "approx_tokens": 520}}, "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "max_tokens": 8, "requests": 3}, {"name": "lat-r1-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}, {"name": "lat-r2-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}], "memory_override_mb": {"host-a": 5200, "host-b": 10800}, "load_timeout_s": 900, "request_timeout_s": 300, "tag": "trace-2-mlxtbccl", "primary": {"phase": "lat-r1-p128-o32", "metric": "tpot"}, "trace": true}, "timeout_s": 1800}
  - {"name": "trace-3-mlxtbccl", "benchmark": "exo_stage_profile", "operation": "trace", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "metal"}, "orientations": ["forward"], "options": {"model_id": "mlx-community/Qwen3-0.6B-8bit", "backend": "MlxTbccl", "prompts": {"short": {"text": "Count from one to five in words.", "approx_tokens": 20}, "p16": {"items": 0, "approx_tokens": 24}, "p128": {"items": 6, "approx_tokens": 140}, "p512": {"items": 24, "approx_tokens": 520}}, "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "max_tokens": 8, "requests": 3}, {"name": "lat-r1-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}, {"name": "lat-r2-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}], "memory_override_mb": {"host-a": 5200, "host-b": 10800}, "load_timeout_s": 900, "request_timeout_s": 300, "tag": "trace-3-mlxtbccl", "primary": {"phase": "lat-r1-p128-o32", "metric": "tpot"}, "trace": true}, "timeout_s": 1800}
  - {"name": "trace-4-mlxring", "benchmark": "exo_stage_profile", "operation": "trace", "sizes": [1], "memory_backend": {"host-a": "cuda", "host-b": "metal"}, "orientations": ["forward"], "options": {"model_id": "mlx-community/Qwen3-0.6B-8bit", "backend": "MlxRing", "prompts": {"short": {"text": "Count from one to five in words.", "approx_tokens": 20}, "p16": {"items": 0, "approx_tokens": 24}, "p128": {"items": 6, "approx_tokens": 140}, "p512": {"items": 24, "approx_tokens": 520}}, "phases": [{"name": "warm", "kind": "warmup", "prompt": "p128", "max_tokens": 8, "requests": 3}, {"name": "lat-r1-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}, {"name": "lat-r2-p128-o32", "kind": "rounds", "prompt": "p128", "max_tokens": 32, "conc": 1, "requests": 15}], "memory_override_mb": {"host-a": 5200, "host-b": 10800}, "load_timeout_s": 900, "request_timeout_s": 300, "tag": "trace-4-mlxring", "primary": {"phase": "lat-r1-p128-o32", "metric": "tpot"}, "trace": true}, "timeout_s": 1800}
