# Standard sweep over the core benchmarks on loopback with explicit repetition settings. NOT run automatically; it is long.
# 2, 3 and 4 ranks on one machine: use it to compare builds, not to claim speed (see docs/development/benchmark-methodology.md).
schema: tbccl-bench-config/1
name: core-loopback
description: Standard payload sweep, core benchmarks, loopback
defaults:
  warmup: 20
  iterations: 200
  repetitions: 5
  timeout_s: 300
limits:
  max_processes: 4
topology: {kind: loopback, interconnect: loopback, transport: tcp, physical: false}
hosts:
  local: {launcher: {kind: local}, address: 127.0.0.1}
ranks:
  - {rank: 0, host: local, memory_backend: host}
  - {rank: 1, host: local, memory_backend: host}
  - {rank: 2, host: local, memory_backend: host}
  - {rank: 3, host: local, memory_backend: host}
workloads:
  - {name: tcp, benchmark: tcp_pingpong, operations: [pingpong, stream], sizes: standard, rank_counts: [2]}
  - {name: small-message, benchmark: small_message_latency, operations: [p2p, oneway, allgather, allreduce], sizes: standard, rank_counts: [2]}
  - {name: tensor-p2p, benchmark: tensor_transfer, operations: [latency_floor, network_only], sizes: standard, rank_counts: [2]}
  - name: collectives
    benchmark: collective_bench
    operations: [all_reduce, all_gather, reduce_scatter]
    algorithms: [reference, ring, auto]
    datatype: float32
    sizes: standard
    rank_counts: [2, 3, 4]
