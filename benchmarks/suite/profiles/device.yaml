# Device memory between two hosts: CUDA pinned memory on one host and Metal shared memory on the other, transfers and asynchronous staging.
# Profile: device. Needs a TBCCL build with CUDA on one host and Metal on the other (-DTBCCL_ENABLE_CUDA=ON, -DTBCCL_ENABLE_METAL=ON). A backend the build lacks is reported as unsupported, never replaced by host memory. Physical.
# Copy this file to device.local.yaml (git-ignored) or keep your real values in an overlay passed with --overlay; fill every <PLACEHOLDER>. Nothing private belongs in this tracked file.
#   python3 -m benchmarks.suite doctor device.local.yaml --probe --allow-physical
#   python3 -m benchmarks.suite run device.local.yaml --dry-run
#   python3 -m benchmarks.suite run device.local.yaml --allow-physical
schema: tbccl-bench-config/1
name: device
description: "CUDA-pinned and Metal-shared transfers between two hosts"
defaults:
  warmup: 20
  iterations: 100
  repetitions: 3
  timeout_s: 300
  startup_wait_s: 20
  lease_s: 30                        # a remote rank is terminated if the controller is silent this long
  term_grace_s: 3
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: true, require_stamped: false}
  health: {strict: true, snapshot_each_point: true}
limits: {max_processes: 2, max_campaign_s: 3600}
topology:
  kind: direct-link
  interconnect: <INTERCONNECT_LABEL>   # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine you run the suite on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables_dir: <HOST_A_BUILD_DIR>
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables_dir: <HOST_B_BUILD_DIR>
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: cuda-pinned, interface: link}
  - {rank: 1, host: host-b, memory_backend: metal-shared, interface: link}
workloads:
  - {name: tcp-host-control, benchmark: tcp_pingpong, operations: [pingpong], sizes: smoke, memory_backend: host, orientations: [forward, reverse]}
  - {name: transfer-device, benchmark: tensor_transfer, operations: [end_to_end], sizes: [4096, 1048576], orientations: [forward, reverse]}
  - {name: transfer-host-control, benchmark: tensor_transfer, operations: [end_to_end], sizes: [4096, 1048576], memory_backend: host, orientations: [forward, reverse]}
