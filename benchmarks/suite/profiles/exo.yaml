# Exo pipeline over a two-node cluster: MlxRing against MlxTbccl, same model, placement and workload, one cluster lifecycle per repetition.
# Profile: exo. Needs the maintained exo fork integration with exo-tbccl on both hosts, the model already present on both, and a clone of the exo-tbccl repository (the provider). Nothing is downloaded. Physical. The default configuration only: experimental settings need a separate workload with tier: fastpath.
# Copy this file to exo.local.yaml (git-ignored) or keep your real values in an overlay passed with --overlay; fill every <PLACEHOLDER>. Nothing private belongs in this tracked file.
#   python3 -m benchmarks.suite providers exo.local.yaml
#   python3 -m benchmarks.suite doctor exo.local.yaml --probe --allow-physical
#   python3 -m benchmarks.suite run exo.local.yaml --dry-run
#   python3 -m benchmarks.suite run exo.local.yaml --allow-physical
schema: tbccl-bench-config/1
name: exo
description: "Exo MlxRing against MlxTbccl between two hosts"
defaults:
  warmup: 0
  iterations: 1
  repetitions: 3
  timeout_s: 3000
  startup_wait_s: 90
  lease_s: 30                        # a remote rank is terminated if the controller is silent this long
  term_grace_s: 3
  port_range: [<PORT_RANGE_START>, <PORT_RANGE_END>]
  failure_policy: {on_failure: abort_run}
  provenance: {require_same_version: true, require_stamped: false}
  health: {strict: true, snapshot_each_point: true}
limits: {max_processes: 8, max_campaign_s: 14400}
topology:
  kind: direct-link
  interconnect: <INTERCONNECT_LABEL>   # a label for reports; TBCCL's transport is TCP over IPv4, never RDMA
  transport: tcp
  physical: true
hosts:
  host-a:                            # the machine you run the suite on
    launcher: {kind: local}
    address: <HOST_A_LINK_ADDRESS>
    interface: <HOST_A_LINK_INTERFACE>
    interfaces: {link: <HOST_A_LINK_ADDRESS>}
    executables: {exo: <HOST_A_EXO>, exo_python: <HOST_A_EXO_PYTHON>, exo_bench_dir: <EXO_TBCCL_CHECKOUT>/benchmarks/provider, exo_home: <HOST_A_EXO_HOME>, exo_dashboard_dir: <HOST_A_EXO_DASHBOARD_DIR>, exo_lan_address: <HOST_A_LAN_ADDRESS>}
    health_snapshot: true
    expect: {mtu: <EXPECTED_MTU>}
  host-b:                            # reached through a management-path launcher (never the data link)
    launcher: {kind: prefix, argv: ["<REMOTE_LAUNCH_PREFIX>", "<REMOTE_HOST_NAME>"], shell_join: true}
    python: <HOST_B_PYTHON>
    address: <HOST_B_LINK_ADDRESS>
    interface: <HOST_B_LINK_INTERFACE>
    interfaces: {link: <HOST_B_LINK_ADDRESS>}
    management_address: <HOST_B_MANAGEMENT_ADDRESS>   # checked: the controller must reach it through a different interface than the data link
    executables: {exo: <HOST_B_EXO>, exo_python: <HOST_B_EXO_PYTHON>, exo_bench_dir: <HOST_B_EXO_BENCH_DIR>, exo_home: <HOST_B_EXO_HOME>, exo_dashboard_dir: <HOST_B_EXO_DASHBOARD_DIR>, exo_lan_address: <HOST_B_LAN_ADDRESS>}
    health_script: <HOST_B_REPOSITORY>/scripts/tb4_health_snapshot.py
    expect: {mtu: <EXPECTED_MTU>}
ranks:
  - {rank: 0, host: host-a, memory_backend: host, interface: link}
  - {rank: 1, host: host-b, memory_backend: host, interface: link}
workloads:
  # the same workload with each backend; interleave A,B,B,A in your own runs when the machines can drift. Exo chooses the stage order: the placement that happened is recorded and only matching placements are compared
  - &ab
    name: latency-mlxring
    benchmark: exo_transport_ab
    operation: ab
    sizes: [1]
    memory_backend: {host-a: cuda, host-b: metal}
    timeout_s: 3000
    options: &opts
      model_id: <MODEL_ID>
      backend: MlxRing
      prompts: {p128: {items: 6, approx_tokens: 140}}
      phases:
        - {name: warm, kind: warmup, prompt: p128, max_tokens: 8, requests: 3}
        - {name: lat-p128-o32, kind: rounds, prompt: p128, max_tokens: 32, conc: 1, requests: 5}
      primary: {phase: lat-p128-o32, metric: tpot}
  - <<: *ab
    name: latency-mlxtbccl
    options: {<<: *opts, backend: MlxTbccl}
