<p class="tb-chart-hint">Scroll the chart sideways to see all of it, or read the table below.</p>
<figcaption>Host memory, TBCCL 0.6.0 over TCP/IPv4, direct Thunderbolt 4 link, MTU 9000. The two round-trip series are ping-pongs that include the return trip and are not halved; the completion-confirmed series times one transfer up to its acknowledgement. The three series have different timing semantics and are not a like-for-like comparison. Values are medians over independent repetitions (3-6) of each repetition&#x27;s median, except the TCP series, which is the mean per repetition. Exact figures are in the table below the chart.</figcaption>
</figure>
