<figure class="tb-chart" id="chart-native-staging">
<p class="tb-chart-title">Completion time of a 16 MiB transfer by memory path, Linux (CUDA) to Mac (Metal)</p>
<div class="tb-chart-scroll" role="region" tabindex="0" aria-label="Chart: Completion time of a 16 MiB transfer by memory path, Linux (CUDA) to Mac (Metal) (scrolls sideways on narrow screens)"><svg viewBox="0 0 600 190" role="img" aria-labelledby="native-staging-t native-staging-d" xmlns="http://www.w3.org/2000/svg"><title id="native-staging-t">Completion time of a 16 MiB transfer by memory path, Linux (CUDA) to Mac (Metal)</title><desc id="native-staging-d">Horizontal bars, lower is better. Host memory control 8,667 microseconds. CUDA pinned memory to Metal shared memory with synchronous staging 9,968 microseconds, which is 1,301 more than the control. Asynchronous chunked staging with 256 KiB chunks at depth 2 took 8,677 microseconds, equal to the control, so the staging was overlapped with the transfer. This shows an overlap benefit in completion time; it is not direct device-to-device DMA.</desc><defs><pattern id="native-staging-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="tb-chart-hatch-bg"/><path class="tb-chart-hatch-line" d="M0 0V6"/></pattern><pattern id="native-staging-hatch-accent" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="tb-chart-hatch-bg"/><path class="tb-chart-hatch-line" style="stroke:var(--tb-accent-tbccl)" d="M0 0V6"/></pattern></defs><text class="tb-chart-note" x="0" y="20">Local CUDA device-to-host staging alone (16 MiB, no network): 1,279 us</text><path class="tb-chart-grid" d="M210 30V142"/><path class="tb-chart-grid" d="M357 30V142"/><path class="tb-chart-grid" d="M504 30V142"/><text class="tb-chart-group" x="0" y="44">16 MiB, A to B</text><text class="tb-chart-label" x="196" y="70.5" text-anchor="end">Host memory (control)</text><rect class="tb-chart-bar" x="210" y="57.5" width="254.81" height="17" style="fill:url(#native-staging-hatch)"/><path class="tb-chart-range" d="M464.72 66H464.87M464.72 61V71M464.87 61V71"/><text class="tb-chart-value" x="471.87" y="70.5">8,667 us</text><text class="tb-chart-label" x="196" y="98.5" text-anchor="end">CUDA to Metal, synchronous</text><rect class="tb-chart-bar" x="210" y="85.5" width="293.06" height="17" style="fill:var(--tb-accent-tbccl)"/><path class="tb-chart-range" d="M502.74 94H503.53M502.74 89V99M503.53 89V99"/><text class="tb-chart-value" x="510.53" y="98.5">9,968 us</text><text class="tb-chart-label" x="196" y="126.5" text-anchor="end">CUDA to Metal, async chunks</text><rect class="tb-chart-bar" x="210" y="113.5" width="255.1" height="17" style="fill:url(#native-staging-hatch-accent)"/><path class="tb-chart-range" d="M464.93 122H466.28M464.93 117V127M466.28 117V127"/><text class="tb-chart-value" x="473.28" y="126.5">8,677 us</text><text class="tb-chart-tick" x="210" y="158" text-anchor="middle">0</text><text class="tb-chart-tick" x="357" y="158" text-anchor="middle">5,000</text><text class="tb-chart-tick" x="504" y="158" text-anchor="middle">10,000</text><path class="tb-chart-axis" d="M210 30V142"/><text class="tb-chart-unit" x="357" y="176" text-anchor="middle">microseconds to completion (lower is better)</text></svg></div>
<p class="tb-chart-hint">Scroll the chart sideways to see all of it, or read the table below.</p>
<figcaption>16 MiB, completion-confirmed, A to B, TBCCL 0.6.0 over TCP/IPv4. Both device paths stage through host memory; there is no direct CUDA-to-Metal DMA. Submitting an asynchronous operation returns in microseconds and says nothing about completion; the bars are completion times. Values are medians over 3 independent repetitions; the whisker is the minimum to maximum over those repetitions. Exact figures are in the table below the chart.</figcaption>
</figure>
